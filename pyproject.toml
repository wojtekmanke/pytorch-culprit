[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-culprit"
version = "0.0.1"
description = "Training data attribution in PyTorch, with every method graded against retraining"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "torch>=2.6",
    "numpy",
    "safetensors",
]

[project.optional-dependencies]
# For attributing a pretrained language model: culprit.llm.
llm = ["transformers>=4.45"]
dev = ["pytest", "hypothesis", "ruff", "mypy"]

[project.scripts]
culprit = "culprit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
culprit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "mps: needs the Apple GPU and is skipped where it is absent",
    "slow: trains for more than a few seconds",
]
# Raised from inside torch.func, not by anything this package calls.
filterwarnings = ["ignore:.torch.jit.script. is deprecated:FutureWarning"]

[tool.ruff]
line-length = 100
# The repository root too, so that benchmarks and experiments sort as our own.
src = ["src", "tests", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The formatter wraps what it can; long string literals are left alone.
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
